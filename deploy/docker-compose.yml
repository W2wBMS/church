# Church 2.0 — VPS stack: API + Supabase + nginx (TLS).
# Usage (on the Contabo host):
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#
# nginx terminates TLS with certs from certbot (see DEPLOY.md) and proxies
# /api to the API container. The static frontend is served by Vercel, so this
# host only needs to expose the API over HTTPS.

services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "4000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  # One-shot / cron container to obtain & renew Let's Encrypt certificates.
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
